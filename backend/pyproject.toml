[project]
name = "autoeval-backend"
version = "0.1.0"
description = "AutoEval single-workspace backend foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "temporalio>=1.9,<2",
  "httpx>=0.28,<1", "boto3>=1.35,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoeval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
