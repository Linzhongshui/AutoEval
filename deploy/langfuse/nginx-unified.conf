worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_cookie $langfuse_has_session {
    default 0;
    "~(?:^|;\s*)(?:__Secure-)?next-auth\.session-token(?:\.[0-9]+)?=" 1;
  }
  ssl_certificate /config/server.crt;
  ssl_certificate_key /config/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 32m;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 120s;
  server {
    listen 80 default_server;
    server_name 179.214.2.3 langfuse.autoeval.local;
    return 308 https://$host$request_uri;
  }
  server {
    listen 443 ssl default_server;
    server_name 179.214.2.3;
    location / {
      proxy_pass https://127.0.0.1:18443;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /config/autoeval-ca.crt;
      proxy_ssl_server_name on;
      proxy_ssl_name localhost;
    }
  }
  server {
    listen 443 ssl;
    server_name langfuse.autoeval.local;
    location / { proxy_pass http://172.17.0.3:19030; }
  }
  server {
    listen 8443 ssl;
    server_name 179.214.2.3;
    # Explicitly shared structural demo trace; Langfuse still checks its public flag.
    location = /project/autoeval-harbor/traces/cfc0e6ea48fd58abbf8bc638c4e0cb36 {
      proxy_pass http://172.17.0.3:19030;
    }
    # Keep private traces protected, but send first-time visitors straight to login.
    # Captures allow only project IDs and trace IDs; callback cannot leave this origin.
    location ~ "^/project/([A-Za-z0-9_-]+)/traces/([0-9a-f]{32})/?$" {
      if ($langfuse_has_session = 0) {
        return 302 "https://179.214.2.3:8443/auth/sign-in?targetPath=%2Fproject%2F$1%2Ftraces%2F$2";
      }
      proxy_pass http://172.17.0.3:19030;
    }
    location / { proxy_pass http://172.17.0.3:19030; }
  }
}
